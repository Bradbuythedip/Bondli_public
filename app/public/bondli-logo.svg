<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" fill="none">
  <defs>
    <linearGradient id="bl1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5555"/>
      <stop offset="50%" stop-color="#dd1818"/>
      <stop offset="100%" stop-color="#881010"/>
    </linearGradient>
    <linearGradient id="bl2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4040" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#771010" stop-opacity=".9"/>
    </linearGradient>
  </defs>
  <!-- Pill shape -->
  <g transform="translate(25,10) scale(5)">
    <path d="M15,2 Q23,2 26,8 L27,20 L27,22 L26,34 Q23,40 15,40 L15,2 Z" fill="url(#bl1)"/>
    <path d="M15,2 Q7,2 4,8 L3,20 L3,22 L4,34 Q7,40 15,40 L15,2 Z" fill="url(#bl2)"/>
    <!-- Ghost B watermark -->
    <text x="15" y="25" text-anchor="middle" dominant-baseline="central" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="16" fill="#ffffff" opacity="0.06">B</text>
  </g>
  <!-- Wordmark -->
  <text x="100" y="240" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="38" letter-spacing="3" fill="#ffffff">BOND<tspan fill="#dd1818">LI</tspan></text>
</svg>
